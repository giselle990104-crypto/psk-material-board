name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q curl_cffi
          cat > p.py <<'PY'
          from curl_cffi import requests as r
          s=r.Session(impersonate="chrome")
          def note(t,m): print("::notice title=%s::%s"%(t,str(m).replace("\n"," | ").replace("%","")[:950]))
          import json
          s.get("https://www.komis.or.kr/Komis/RsrcPrice/IronOre",timeout=30)
          H={"X-Requested-With":"XMLHttpRequest","Referer":"https://www.komis.or.kr/Komis/RsrcPrice/IronOre","Content-Type":"application/x-www-form-urlencoded; charset=UTF-8"}
          x=s.post("https://www.komis.or.kr/ajax/common/getMnrlKndInfoCodeList",data={"cdType":"HP000","cdGrp":"HP003"},headers=H,timeout=30)
          L=x.json().get("data",[]) if x.ok else []
          note("list", " ; ".join(f"{a.get('mnrkndUnqCd')}={a.get('mnrkndKornNm')}" for a in L)[:950] if L else x.text[:900])
          iron=[a for a in L if '철' in str(a.get('mnrkndKornNm',''))]
          for a in iron:
              c=a.get('mnrkndUnqCd')
              y=s.post("https://www.komis.or.kr/Komis/RsrcPrice/ajax/getMnrlPriceCrtr",data={"HP000":"HP003","mnrkndUnqCd":c},headers=H,timeout=30)
              note("crtr "+c, y.text[:400])
              crs=[d.get('cdKey') for d in y.json().get('data',[])]
              for cr in crs[:4]:
                  d={"mnrkndUnqRadioCd":c,"srchMnrkndUnqCd":c,"srchPrcCrtr":cr,"srchAvgOpt":"MONTH","srchField":"year","srchStartDate":"2018","srchEndDate":"2026","srchCompareMnrkndUnqCd":"","srchComparePrcCrtr":"","lmeInvt":"Y","HP000":"HP003"}
                  z=s.post("https://www.komis.or.kr/Komis/RsrcPrice/ajax/getChartData",data=d,headers=H,timeout=30).json().get("data",{})
                  xa=z.get("xaxis",[]); se=z.get("series",[{}])[0].get("data",[])
                  note(f"chart {c} {cr}", f"{json.dumps(z.get('mnrlInfo'),ensure_ascii=False)} n={len(xa)} first={xa[:2]}{se[:2]} last={xa[-3:]}{se[-3:]}")
          PY
          python p.py
