name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          cat > p.py <<'PY'
          import asyncio, re
          from playwright.async_api import async_playwright
          def note(t,m): print("::notice title=%s::%s"%(t,str(m).replace("\n"," ").replace("%","")[:950]))
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(); pg=await b.new_page()
                  r=await pg.goto("https://www.komis.or.kr/robots.txt"); note("robots", (await r.text())[:600] if r else None)
                  reqs=[]
                  pg.on("request", lambda q: reqs.append((q.method, q.url, (q.post_data or "")[:300])) if q.resource_type in ("xhr","fetch") else None)
                  bodies=[]
                  async def onresp(res):
                      if res.request.resource_type in ("xhr","fetch"):
                          try: bodies.append((res.url, (await res.text())[:500]))
                          except Exception: pass
                  pg.on("response", lambda res: asyncio.ensure_future(onresp(res)))
                  await pg.goto("https://www.komis.or.kr/Komis/RsrcPrice/IronOre", wait_until="networkidle", timeout=60000)
                  await pg.wait_for_timeout(5000)
                  for i,(m,u,d) in enumerate(reqs[:12]): note("req%d"%i, f"{m} {u} | {d}")
                  for i,(u,t) in enumerate(bodies[:8]): note("body%d"%i, f"{u} => {t}")
                  sels=await pg.eval_on_selector_all("select", "els=>els.map(e=>(e.id||e.name)+':'+[...e.options].slice(0,15).map(o=>o.textContent.trim()+'='+o.value).join('/'))")
                  note("selects", sels)
                  tx=await pg.inner_text("body"); k=tx.find("철광석"); note("text", tx[max(0,k-200):k+800])
                  await b.close()
          asyncio.run(main())
          PY
          python p.py
