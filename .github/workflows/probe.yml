name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q curl_cffi
          cat > p.py <<'PY'
          from curl_cffi import requests as r
          s=r.Session(impersonate="chrome")
          H={"domain-id":"kr","Origin":"https://kr.investing.com","Referer":"https://kr.investing.com/"}
          def note(t,m): print("::notice title=%s::%s"%(t,str(m).replace("\n"," ").replace("%","")[:900]))
          import re
          x=s.get("https://api.investing.com/api/search/v2/search",params={"q":"stainless"},headers=H,timeout=20); note("raw",x.text[:850])
          for slug in ["commodities/stainless-steel","commodities/stainless-steel-futures","commodities/shfe-stainless-steel","commodities/stainless-steel-futures-historical-data","commodities/lme-stainless-steel","commodities/nickel"]:
              try:
                  y=s.get("https://www.investing.com/"+slug,timeout=25)
                  ids=set(re.findall(r'"instrument_id":"?(\d+)',y.text))|set(re.findall(r'data-pair-id="(\d+)"',y.text))
                  t=re.search(r"<title>(.*?)</title>",y.text,re.S)
                  note("page "+slug,"%s %s ids=%s"%(y.status_code,(t.group(1).strip()[:80] if t else ''),sorted(ids)[:6]))
              except Exception as e: note("page "+slug,"ERR "+repr(e))
          PY
          python p.py
