name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q curl_cffi
          cat > p.py <<'PY'
          from curl_cffi import requests as r
          s=r.Session(impersonate="chrome")
          H={"domain-id":"kr","Origin":"https://kr.investing.com","Referer":"https://kr.investing.com/"}
          def note(t,m): print("::notice title=%s::%s"%(t,str(m).replace("\n"," ").replace("%","")[:900]))
          for q in ["stainless","stainless steel","스테인리스","SS futures"]:
              try:
                  x=s.get("https://api.investing.com/api/search/v2/search",params={"q":q},headers=H,timeout=20)
                  j=x.json(); qs=j.get("quotes",[]) if isinstance(j,dict) else []
                  note("search "+q, "%s | "%x.status_code + " ; ".join("%s:%s:%s:%s"%(a.get("id"),a.get("description") or a.get("name"),a.get("exchange"),a.get("url")) for a in qs[:8]) or x.text[:300])
              except Exception as e: note("search "+q,"ERR "+repr(e))
          PY
          python p.py
