name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q curl_cffi playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          cat > p.py <<'PY'
          import asyncio, re, json
          from curl_cffi import requests as r
          from playwright.async_api import async_playwright
          def note(t,m): print("::notice title=%s::%s"%(t,str(m).replace("\n"," | ").replace("%","")[:950]))
          s=r.Session(impersonate="chrome")
          for sym in ["AO0"]:
              y=s.get("https://stock2.finance.sina.com.cn/futures/api/jsonp.php/var%20_x=/InnerFuturesNewService.getDailyKLine",params={"symbol":sym},headers={"Referer":"https://finance.sina.com.cn/"},timeout=30)
              t=y.text; a=t.find("("); arr=json.loads(t[a+1:t.rfind(")")]) if a>0 else []
              note("sina "+sym, f"n={len(arr)} first={arr[:1]} last={arr[-1:]}")
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch()
                  for u in ["https://www-old.metal.com/Photovoltaic/202307130006","https://www-old.metal.com/photovoltaic/202412120001","https://www.index.go.kr/unity/potal/main/EachDtlPageDetail.do?idx_cd=1485"]:
                      pg=await b.new_page(); xs=[]
                      async def onr(res, xs=xs):
                          if res.request.resource_type in ("xhr","fetch"):
                              try: xs.append((res.url, (await res.text())[:400]))
                              except Exception: pass
                      pg.on("response", lambda res: asyncio.ensure_future(onr(res)))
                      try:
                          await pg.goto(u, wait_until="networkidle", timeout=60000); await pg.wait_for_timeout(4000)
                          tx=await pg.inner_text("body")
                          k=max(tx.find("Price"),tx.find("가격"),0)
                          note("text "+u[-25:], tx[k:k+900])
                          for i,(uu,bb) in enumerate([x for x in xs if not re.search(r"(google|analytics|baidu|gtag|cookie|log)",x[0])][:8]): note(f"xhr{i} {u[-12:]}", uu[:200]+" => "+bb)
                      except Exception as e: note("ERR "+u[-25:], repr(e)[:300])
                      await pg.close()
                  await b.close()
          asyncio.run(main())
          PY
          python p.py
