name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q curl_cffi
          cat > p.py <<'PY'
          from curl_cffi import requests as r
          s=r.Session(impersonate="chrome")
          H={"domain-id":"kr","Origin":"https://kr.investing.com","Referer":"https://kr.investing.com/"}
          def note(t,m): print("::notice title=%s::%s"%(t,str(m).replace("\n"," ").replace("%","")[:900]))
          import re, json
          try:
              y=s.get("https://stock2.finance.sina.com.cn/futures/api/jsonp.php/var%20_SS0=/InnerFuturesNewService.getDailyKLine",params={"symbol":"SS0"},headers={"Referer":"https://finance.sina.com.cn/"},timeout=30)
              t=y.text; a=t.find("("); arr=json.loads(t[a+1:t.rfind(")")]) if a>0 else []
              note("sina SS0","%s n=%d first=%s last=%s"%(y.status_code,len(arr),arr[:1],arr[-2:]))
          except Exception as e: note("sina SS0","ERR "+repr(e)+" "+y.text[:200] if 'y' in dir() else repr(e))
          try:
              y=s.get("https://www.shfe.com.cn/data/tradedata/future/dailydata/kx20261028.dat",headers={"Referer":"https://www.shfe.com.cn/"},timeout=30)
              note("shfe",str(y.status_code)+" "+y.text[:300])
          except Exception as e: note("shfe","ERR "+repr(e))
          PY
          python p.py
