name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q curl_cffi pypdf
          cat > p.py <<'PY'
          import io, re, json
          from curl_cffi import requests as r
          from pypdf import PdfReader
          s=r.Session(impersonate="chrome")
          OUT=open("probe_out.txt","w")
          def note(t,m): OUT.write(f"{t}: {m}\n"); OUT.flush()
          pdfs={"2026H2":"https://www.kseis.co.kr/bbs/data/dataFileDown.do?bbs_seq=82199305780142&file_no=2",
                "2023H1":"https://www.kseis.co.kr/bbs/data/dataFileDown.do?bbs_seq=244517218101&file_no=2",
                "2021H1":"https://www.kseis.co.kr/bbs/data/dataFileDown.do?bbs_seq=944441150001&file_no=2",
                "2020H2":"http://data.cmpi.or.kr/program/board/2020%EB%85%84%20%ED%95%98%EB%B0%98%EA%B8%B0%20%EC%A0%81%EC%9A%A9%20%EA%B1%B4%EC%84%A4%EC%97%85%20%EC%9E%84%EA%B8%88%EC%8B%A4%ED%83%9C%EC%A1%B0%EC%82%AC%20%EB%B3%B4%EA%B3%A0%EC%84%9C.pdf",
                "2024H1":"https://files-scs.pstatic.net/2024/02/25/dJC4pX8E6k/2024%EB%85%84%EC%83%81%EB%B0%98%EA%B8%B0%EC%A0%81%EC%9A%A9%EA%B1%B4%EC%84%A4%EC%97%85%EC%9E%84%EA%B8%88%EC%8B%A4%ED%83%9C%EC%A1%B0%EC%82%AC%EB%B3%B4%EA%B3%A0%EC%84%9C.pdf"}
          for k,u in pdfs.items():
              try:
                  x=s.get(u,timeout=60,allow_redirects=True)
                  if x.content[:4]!=b"%PDF": note("pdf "+k, f"{x.status_code} not pdf {x.headers.get('content-type')} {x.content[:80]}"); continue
                  t="\n".join((p.extract_text() or "") for p in PdfReader(io.BytesIO(x.content)).pages)
                  hd=[ln for ln in t.split("\n") if re.search(r"20\d\d\.\s?\d{1,2}\.\s?1",ln)][:6]
                  wl=[ln for ln in t.split("\n") if "용접공" in ln][:6]
                  note("pdf "+k, f"pages ok | heads={hd} | weld={wl}")
              except Exception as e: note("pdf "+k, "ERR "+repr(e)[:200])
          H={"domain-id":"kr","Origin":"https://kr.investing.com","Referer":"https://kr.investing.com/"}
          for q in ["gasoil","heating oil","crude oil wti","natural gas","baltic dry","USD/VND","USD/MYR","USD/CHF","USD/JPY","coal","rotterdam coal","freight"]:
              try:
                  j=s.get("https://api.investing.com/api/search/v2/search",params={"q":q},headers=H,timeout=20).json()
                  qs=j.get("quotes",[])
                  note("inv "+q, " ; ".join(f"{a.get('id')}:{a.get('description') or a.get('name')}:{a.get('exchange')}:{a.get('type')}:{a.get('url')}" for a in qs[:6]))
              except Exception as e: note("inv "+q, "ERR "+repr(e)[:150])
          for sid in ["PCU483111483111","PCU4841214841212","PCU484121484121","PCU481112481112","PCU488510488510","DCOILBRENTEU","DCOILWTICO","GASDESW","DHHNGSP","PCU221122221122","APU000072610"]:
              try:
                  x=s.get("https://fred.stlouisfed.org/graph/fredgraph.csv",params={"id":sid},timeout=30)
                  L=x.text.strip().split("\n"); note("fred "+sid, f"{x.status_code} n={len(L)} {L[:2]} {L[-1:]}")
              except Exception as e: note("fred "+sid, "ERR "+repr(e)[:150])
          for u in ["https://www.newyorkfed.org/medialibrary/research/interactives/gscpi/downloads/gscpi_data.xlsx"]:
              try: x=s.get(u,timeout=30); note("gscpi", f"{x.status_code} {len(x.content)} {x.content[:4]}")
              except Exception as e: note("gscpi","ERR "+repr(e)[:150])
          PY
          python p.py
          git config user.name bot; git config user.email bot@x
          git checkout -b probe-out; git add -f probe_out.txt; git commit -qm out; git push -f origin probe-out
