name: probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          pip install -q curl_cffi
          cat > p.py <<'PY'
          import json
          from curl_cffi import requests as r
          U="https://api.investing.com/api/financialdata/historical/{}?start-date=2026-10-01&end-date=2026-10-26&time-frame=Daily&add-missing-rows=false"
          H={"domain-id":"kr","Origin":"https://kr.investing.com","Referer":"https://kr.investing.com/"}
          def note(t,m): print("::notice title=%s::%s"%(t,str(m).replace("\n"," ").replace("%","")[:300]))
          for imp in ["chrome","safari"]:
              try:
                  x=r.get(U.format(8831),headers=H,impersonate=imp,timeout=20)
                  note("inv-"+imp,"%s %s"%(x.status_code,x.text[:200]))
              except Exception as e: note("inv-"+imp,"ERR "+repr(e))
          try:
              x=r.get("https://query1.finance.yahoo.com/v8/finance/chart/HG=F?range=5d&interval=1d",impersonate="chrome",timeout=20)
              note("yahoo","%s %s"%(x.status_code,x.text[:150]))
          except Exception as e: note("yahoo","ERR "+repr(e))
          PY
          python p.py
