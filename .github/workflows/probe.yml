name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q curl_cffi
          cat > p.py <<'PY'
          from curl_cffi import requests as r
          s=r.Session(impersonate="chrome")
          def note(t,m): print("::notice title=%s::%s"%(t,str(m).replace("\n"," | ").replace("%","")[:950]))
          note("robots", s.get("https://www.komis.or.kr/robots.txt",timeout=20).text[:900])
          s.get("https://www.komis.or.kr/Komis/RsrcPrice/IronOre",timeout=30)
          H={"X-Requested-With":"XMLHttpRequest","Referer":"https://www.komis.or.kr/Komis/RsrcPrice/IronOre","Content-Type":"application/x-www-form-urlencoded; charset=UTF-8"}
          x=s.post("https://www.komis.or.kr/Komis/RsrcPrice/ajax/getMnrlPriceCrtr",data={"HP000":"HP003","mnrkndUnqCd":"MNRL0031"},headers=H,timeout=30); note("crtr",x.status_code); print("::notice title=crtr body::"+x.text[:900].replace("\n"," "))
          base={"mnrkndUnqRadioCd":"MNRL0031","srchMnrkndUnqCd":"MNRL0031","srchPrcCrtr":"509","srchCompareMnrkndUnqCd":"","srchComparePrcCrtr":"","lmeInvt":"Y","HP000":"HP003"}
          for opt,fld,a,b in [("MONTH","month","2021-11","2026-10"),("MONTH","year","2021","2026"),("DAY","month","2026-10","2026-10")]:
              d=dict(base,srchAvgOpt=opt,srchField=fld,srchStartDate=a,srchEndDate=b)
              for ep in ["getChartData","getMnrlPrcByMnrkndUnqCd"]:
                  x=s.post("https://www.komis.or.kr/Komis/RsrcPrice/ajax/"+ep,data=d,headers=H,timeout=30)
                  note(f"{ep} {opt} {fld}", f"{x.status_code} len={len(x.text)} {x.text[:700]}")
          PY
          python p.py
