name: Refresh procurement news
on:
  schedule:
    # 08:00 KST Mon-Fri = 23:00 UTC Sun-Thu
    - cron: '0 23 * * 0-4'
    # 17:00 KST Mon-Fri = 08:00 UTC Mon-Fri
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: procurement-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect verified RSS headlines
        run: python scripts/update_news.py
      - name: Commit changed news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh procurement news briefing"
            git push
          fi
