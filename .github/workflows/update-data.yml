name: 시세 자동 업데이트
on:
  schedule:
    - cron: '7,37 * * * *'   # 30분마다 (매시 7분·37분)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q curl_cffi pypdf
      - run: python scripts/update_data.py
      - run: python scripts/update_sus316.py || echo 'sus316 skipped'
      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json sus316.json quartz.json 2>/dev/null || git add data.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Update data.json ($(TZ=Asia/Seoul date '+%-m/%-d %H:%M') KST)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
